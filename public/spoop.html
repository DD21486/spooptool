<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spoop – SpoopTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="/css/runescape-fonts.css" />
  <link rel="stylesheet" href="/css/spoops.css?v=skill-xp" />
  <style>
    body { background-color: #090b10; }
    .spoop-sprite {
      width: 128px;
      height: 192px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #1a140e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
    }
    .spoop-slot {
      width: 52px;
      height: 52px;
      background: #1c140c;
      border: 2px solid #3f2e1c;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .spoop-slot[data-sell] { cursor: pointer; }
    .spoop-slot:has(.spoop-tip):hover,
    .spoop-slot:has(.spoop-tip):focus-visible {
      z-index: 30;
      outline: none;
      box-shadow: 0 0 0 1px #f0d878;
    }
    .spoop-tips {
      display: none;
      position: absolute;
      right: calc(100% + 8px);
      top: 50%;
      transform: translateY(-50%);
      gap: 8px;
      align-items: flex-start;
      pointer-events: none;
      z-index: 5;
    }
    .spoop-slot:hover .spoop-tips,
    .spoop-slot:focus-visible .spoop-tips {
      display: flex;
    }
    .spoop-tips.is-right {
      right: auto;
      left: calc(100% + 8px);
      flex-direction: row-reverse;
    }
    .spoop-tip {
      display: block;
      width: 168px;
      flex: 0 0 168px;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      text-align: left;
      font-size: 11px;
      line-height: 1.35;
      color: #e2e8f0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .spoop-tip-kicker {
      margin-bottom: 2px;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    @media (max-width: 720px) {
      .equip-grid .spoop-slot:has(.spoop-tip):hover,
      .equip-grid .spoop-slot:has(.spoop-tip):focus {
        z-index: 80;
        outline: none;
      }
      .spoop-slot:hover .spoop-tips,
      .spoop-slot:focus .spoop-tips,
      .spoop-slot:focus-visible .spoop-tips {
        position: fixed;
        left: 8px;
        right: 8px;
        top: auto;
        bottom: max(8px, env(safe-area-inset-bottom));
        width: auto;
        max-height: min(50vh, 320px);
        transform: none;
        overflow: auto;
        z-index: 80;
      }
      .spoop-tip {
        width: auto;
        flex: 1 1 140px;
      }
    }
    .spoop-slot img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .spoop-rate {
      position: absolute;
      right: 2px;
      bottom: 1px;
      font-size: 9px;
      line-height: 1;
      color: #fde68a;
      text-shadow: 0 1px 1px #000;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
    .spoop-grid {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      gap: 4px;
      justify-content: center;
    }
    .spoop-bar {
      height: 10px;
      background: #020617;
      border: 1px solid #334155;
      overflow: hidden;
    }
    .spoop-bar > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #a16207, #eab308 55%, #84cc16);
    }
    .roll-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(2, 6, 23, 0.78);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .roll-modal.sell-ask {
      width: min(360px, 100%);
    }
    .roll-modal.loot-sheet {
      width: min(720px, 100%);
      max-height: min(86vh, 760px);
      overflow: auto;
    }
    .spoop-menu {
      position: fixed;
      z-index: 70;
      min-width: 168px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    .spoop-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 7px 10px;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 13px;
    }
    .spoop-menu button:hover,
    .spoop-menu button:focus-visible {
      background: #1e293b;
      outline: none;
    }
    .spoop-menu button:disabled {
      color: #64748b;
      cursor: default;
    }
    .spoop-menu button:disabled:hover {
      background: transparent;
    }
    .spoop-menu.gear-menu {
      position: fixed;
      z-index: 80;
      min-width: 132px;
    }
    .spoop-slot[data-gear] { cursor: pointer; }
    .roll-modal.compare-sheet {
      width: min(520px, 100%);
    }
    .compare-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .compare-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 0;
      padding: 10px 8px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      text-align: center;
    }
    .compare-card img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .compare-kicker,
    .compare-head span {
      color: #64748b;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .compare-name {
      margin: 0;
      font-size: 13px;
      line-height: 1.3;
    }
    .compare-meta {
      margin: 0;
      color: #94a3b8;
      font-size: 12px;
    }
    .compare-gold {
      margin: 0;
      color: #fde68a;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .compare-stats {
      margin-top: 14px;
    }
    .compare-stats h3 {
      margin: 10px 0 2px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .compare-row {
      display: grid;
      grid-template-columns: 1fr 4.6rem 4.6rem;
      gap: 8px;
      align-items: center;
      padding: 2px 0;
      color: #cbd5e1;
      font-size: 12px;
    }
    .compare-row span:nth-child(n + 2) {
      text-align: right;
    }
    .compare-empty {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 13px;
    }
    .loot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 8px;
    }
    .loot-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
      padding: 6px 4px 8px;
      background: #1c140c;
      border: 1px solid #3f2e1c;
      border-radius: 6px;
    }
    .loot-card img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .loot-card span {
      font-size: 10px;
      line-height: 1.25;
      color: #e2e8f0;
    }
    .loot-card .rare {
      color: #fde68a;
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .loot-card .odds {
      color: #fcd34d;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }
    .loot-card .job {
      color: #94a3b8;
      font-size: 9px;
    }
    .loot-card.is-mega {
      border-color: #b8892c;
      background: linear-gradient(180deg, #2a1d08, #1c140c);
    }
    .mega-box {
      margin-top: 1.25rem;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid #b8892c;
      border-radius: 8px;
      background: linear-gradient(90deg, #2a1d08, #16110c);
      box-shadow: 0 0 12px rgba(240, 200, 90, 0.12);
    }
    .mega-box img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 6px #ffe38a);
    }
    body[data-page="detail"] .spoop-slot.is-mega-chest {
      border-color: #e6c15a;
      box-shadow: 0 0 8px rgba(240, 200, 90, 0.45);
      cursor: pointer;
    }
    body[data-page="detail"] .spoop-slot.is-mega {
      box-shadow: 0 0 7px rgba(240, 200, 90, 0.4), inset 0 0 0 1px #0c0906;
    }
    .spoop-slot.is-mega-chest img { filter: drop-shadow(0 0 4px #ffe38a); }
    body[data-page="detail"] .spoop-slot.is-jackpot {
      border-color: #e6c15a;
      box-shadow: 0 0 8px rgba(240, 200, 90, 0.45);
      cursor: pointer;
    }
    .spoop-slot.is-jackpot img { filter: drop-shadow(0 0 4px #ffe38a); }
    .spoop-slot .mega-count {
      position: absolute;
      left: 3px;
      top: 1px;
      font-size: 10px;
      color: #fde047;
      text-shadow: 1px 1px 0 #000;
    }
    .spoop-tip-mega {
      color: #fde047;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .roll-modal {
      width: min(640px, 100%);
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1rem 1rem 1.1rem;
    }
    .roll-window {
      position: relative;
      overflow: hidden;
      height: 132px;
      background: #1c140c;
      border: 1px solid #3f2e1c;
      border-radius: 8px;
    }
    .roll-marker {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #f0d878;
      z-index: 2;
      transform: translateX(-1px);
      pointer-events: none;
    }
    .roll-strip {
      display: flex;
      height: 100%;
      will-change: transform;
    }
    .roll-card {
      flex: 0 0 104px;
      width: 104px;
      margin-right: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
    }
    .roll-card img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .roll-card span {
      font-size: 10px;
      line-height: 1.2;
      color: #e2e8f0;
      max-width: 96px;
    }
    .roll-card.q-crude span { color: #9d9d9d; }
    .roll-card.q-worn span { color: #ffffff; }
    .roll-card.q-worn img { filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 3px #f4f4f4); }
    .roll-card.q-standard span { color: #1eff00; }
    .roll-card.q-standard img { filter: drop-shadow(0 0 1px #d8ffd4) drop-shadow(0 0 5px #3dff4a); }
    .roll-card.q-fine span { color: #4aa3ff; }
    .roll-card.q-fine img { filter: drop-shadow(0 0 1px #d6e8ff) drop-shadow(0 0 6px #4aa3ff); }
    .roll-card.q-sharpened span { color: #c084fc; }
    .roll-card.q-sharpened img { filter: drop-shadow(0 0 2px #f3e8ff) drop-shadow(0 0 7px #c084fc); }
    .roll-card.q-tempered span { color: #ff8000; }
    .roll-card.q-tempered img { filter: drop-shadow(0 0 2px #ffe7c2) drop-shadow(0 0 8px #ff8a1a); }
    .roll-card.q-masterwork span { color: #e6cc80; }
    .roll-card.q-masterwork img { filter: drop-shadow(0 0 2px #fff6c8) drop-shadow(0 0 9px #ffe38a); }
    .roll-card.is-win:not([class*="q-"]) img {
      filter: drop-shadow(0 0 6px #f0d878);
    }
    .roll-card.is-win.q-worn img { filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 8px #f4f4f4); }
    .roll-card.is-win.q-standard img { filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 10px #3dff4a); }
    .roll-card.is-win.q-fine img { filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 11px #4aa3ff); }
    .roll-card.is-win.q-sharpened img { filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 12px #c084fc); }
    .roll-card.is-win.q-tempered img { filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 13px #ff8a1a); }
    .roll-card.is-win.q-masterwork img { filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 14px #ffe38a); }
    .roll-card.is-mega {
      background: linear-gradient(180deg, #3a2808, #1c140c);
      box-shadow: inset 0 0 0 1px #e6c15a;
    }
    .roll-card.is-mega span { color: #fde047; }
    .roll-card.is-lamp {
      background: linear-gradient(180deg, #2b2410, #1c140c);
      box-shadow: inset 0 0 0 1px #c9a24a;
    }
    .roll-card.is-lamp span { color: #fcd34d; }
    body[data-page="detail"] .spoop-slot.is-lamp {
      border-color: #c9a24a;
      box-shadow: 0 0 6px rgba(240, 200, 90, 0.3);
      cursor: pointer;
    }
    .roll-modal.lamp-modal {
      width: min(380px, 100%);
    }
    .lamp-skills {
      display: grid;
      gap: 4px;
    }
    .lamp-skill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #111827;
      color: #e2e8f0;
      font-size: 13px;
    }
    .lamp-skill:hover:not(:disabled),
    .lamp-skill:focus-visible {
      border-color: #64748b;
      outline: none;
    }
    .lamp-skill.is-on {
      border-color: #e6c15a;
      background: #2a1d08;
    }
    .lamp-skill:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .lamp-box {
      margin-top: 0.75rem;
    }
    .roll-result {
      margin-top: 0.75rem;
      color: #fde68a;
      font-size: 14px;
    }
  </style>
</head>
<body class="spoop-shell min-h-screen antialiased pb-40" data-page="detail">
  <div class="spoop-page spoop-detail">
    <div id="spoop-root"></div>
  </div>
  <script src="/js/spoop.js?v=skill-xp"></script>
</body>
</html>
