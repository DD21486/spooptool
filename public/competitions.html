<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Competitions – SpoopTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="stylesheet" href="/css/runescape-fonts.css" />
  <style>
    body { background-color: #0f172a; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .bob { animation: bob 2.5s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-200 antialiased">

  <!-- ── Password gate — shown on load if session is not unlocked ─────────── -->
  <div id="competition-gate" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 p-4">
    <div class="w-full max-w-sm rounded-xl border border-slate-700 bg-slate-800/80 p-8 shadow-2xl text-center">
      <div class="w-14 h-14 mx-auto mb-5 rounded-full bg-sky-500/10 border border-sky-500/30 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V7.5a4.5 4.5 0 00-9 0v3M5.25 10.5h13.5A1.5 1.5 0 0120.25 12v7.5A1.5 1.5 0 0118.75 21H5.25A1.5 1.5 0 013.75 19.5V12a1.5 1.5 0 011.5-1.5z"/>
        </svg>
      </div>
      <h2 class="text-xl font-bold text-slate-100 mb-1">Competitions</h2>
      <p class="text-sm text-slate-400 mb-6">Enter the password to continue.</p>
      <label for="gate-password" class="block text-sm font-medium text-slate-300 text-left mb-1.5">Password</label>
      <input type="password" id="gate-password" autocomplete="off"
        class="w-full px-3 py-2 rounded-lg bg-slate-700 border border-slate-600 text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm mb-3" />
      <p id="gate-error" class="text-xs text-red-400 mb-3 hidden">Incorrect password.</p>
      <button type="button" id="gate-unlock"
        class="w-full px-4 py-2.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-sm font-medium transition-colors">
        Unlock
      </button>
    </div>
  </div>

  <!-- ── Page content — hidden until password is accepted ────────────────── -->
  <div id="competitions-content" class="max-w-7xl mx-auto px-4 pt-14 sm:pt-6 pb-6 relative hidden">

    <!-- Top-right hamburger menu -->
    <header class="absolute top-3 right-4 z-20 flex justify-end">
      <div class="relative" id="header-menu-wrap">
        <button type="button" id="header-menu-btn" class="p-2 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800 border border-slate-600/80" aria-label="Menu" aria-expanded="false" aria-haspopup="true">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div id="header-menu-dropdown" class="absolute right-0 top-full mt-1.5 w-44 rounded-lg border border-slate-600 bg-slate-800 shadow-xl py-1 hidden" role="menu">
          <a href="index.html" role="menuitem" class="flex items-center gap-2 px-3 py-2 text-sm text-sky-400 hover:bg-slate-700 rounded-lg">
            ← SpoopTool
          </a>
        </div>
      </div>
    </header>
    <script>
      (function () {
        var btn = document.getElementById('header-menu-btn');
        var dropdown = document.getElementById('header-menu-dropdown');
        if (!btn || !dropdown) return;
        function open() { dropdown.classList.remove('hidden'); btn.setAttribute('aria-expanded', 'true'); }
        function close() { dropdown.classList.add('hidden'); btn.setAttribute('aria-expanded', 'false'); }
        function toggle() { if (dropdown.classList.contains('hidden')) open(); else close(); }
        btn.addEventListener('click', function (e) { e.stopPropagation(); toggle(); });
        document.addEventListener('click', function () { close(); });
        dropdown.addEventListener('click', function (e) { e.stopPropagation(); });
      })();
    </script>

    <!-- Page title -->
    <div class="flex flex-col items-center mt-12 mb-6">
      <h1 class="text-4xl font-bold text-slate-100 tracking-tight">Competitions</h1>
    </div>

    <!-- Create competition button -->
    <div class="flex justify-end mb-8">
      <a href="create-competition.html"
        class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-sm font-medium transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        New Competition
      </a>
    </div>

    <!-- Under construction card -->
    <div class="max-w-md mx-auto rounded-xl border border-slate-700 bg-slate-800/50 px-10 py-12 flex flex-col items-center gap-5 text-center mb-8">
      <img src="assets/Construction_icon.png" alt="Under construction" class="w-16 h-16 object-contain bob" width="64" height="64" />
      <div>
        <p class="text-xl font-semibold text-slate-100">Under Construction</p>
        <p class="mt-2 text-sm text-slate-400">We're building something here.<br/>Check back soon!</p>
      </div>
    </div>

    <!-- Active & Upcoming competitions — loaded from /api/competitions -->
    <div class="mb-8">
      <h2 class="text-sm font-medium text-slate-500 uppercase tracking-wide mb-3">Active &amp; Upcoming</h2>
      <div id="comp-list">
        <p class="text-sm text-slate-500 text-center py-6">Loading competitions&hellip;</p>
      </div>
    </div>

    <!-- Past competitions -->
    <div class="mb-8">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-medium text-slate-500 uppercase tracking-wide">Past</h2>
        <select id="past-filter" class="text-xs bg-slate-800 border border-slate-600 text-slate-300 rounded-lg px-2 py-1 focus:outline-none focus:ring-1 focus:ring-sky-500 cursor-pointer">
          <option value="10">Last 10</option>
          <option value="30d">Last 30 days</option>
          <option value="1y">Last year</option>
          <option value="all">All</option>
        </select>
      </div>
      <div id="past-comp-list">
        <p class="text-sm text-slate-500 text-center py-6">Loading&hellip;</p>
      </div>
    </div>

    <script>
      (function () {
        function escHtml(s) {
          return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        function getIcon(comp) {
          if (comp.category === 'boss') {
            var b = (comp.boss || '').replace(/[^a-zA-Z0-9]/g, '');
            return 'assets/bosses/' + b + '.png';
          }
          if (comp.skillScope === 'total' || !comp.skill) return 'assets/Skills_icon.png';
          if (comp.skill === 'Runecrafting') return 'assets/Runecraft_icon.png';
          return 'assets/' + comp.skill + '_icon.png';
        }
        function getStatus(comp) {
          var n = Date.now();
          if (n < new Date(comp.startTime).getTime()) return 'upcoming';
          if (n > new Date(comp.endTime).getTime())   return 'ended';
          return 'active';
        }
        function getSubtitle(comp, status) {
          var typeLabel = comp.type === 'team' ? 'Team' : 'Solo';
          var metricLabel = comp.category === 'boss'
            ? (comp.metric === 'ehb' ? 'EHB' : 'Kill Count')
            : (comp.metric === 'ehp' ? 'EHP' : 'XP');
          var scopeLabel = comp.category === 'boss'
            ? ((comp.boss || '') + ' ' + metricLabel)
            : (comp.skillScope === 'total'
                ? 'Total ' + metricLabel
                : ((comp.skill || '') + ' ' + metricLabel));
          var diff, days;
          if (status === 'upcoming') {
            diff = new Date(comp.startTime).getTime() - Date.now();
            days = Math.ceil(diff / 86400000);
            return typeLabel + ' \u00b7 ' + scopeLabel + ' \u00b7 Starts in ' + days + (days === 1 ? ' day' : ' days');
          }
          if (status === 'active') {
            diff = new Date(comp.endTime).getTime() - Date.now();
            days = Math.ceil(diff / 86400000);
            return typeLabel + ' \u00b7 ' + scopeLabel + ' \u00b7 Ends in ' + days + (days === 1 ? ' day' : ' days');
          }
          return typeLabel + ' \u00b7 ' + scopeLabel + ' \u00b7 Ended';
        }
        function getScopeLabel(comp) {
          var metricLabel = comp.category === 'boss'
            ? (comp.metric === 'ehb' ? 'EHB' : 'Kill Count')
            : (comp.metric === 'ehp' ? 'EHP' : 'XP');
          if (comp.category === 'boss') return (comp.boss || '') + ' ' + metricLabel;
          if (comp.skillScope === 'total') return 'Total ' + metricLabel;
          return (comp.skill || '') + ' ' + metricLabel;
        }
        function formatDate(d) {
          return new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        }
        function renderList(comps) {
          var el = document.getElementById('comp-list');
          if (!el) return;
          var active = comps.filter(function (c) { return getStatus(c) !== 'ended'; });
          if (!active.length) {
            el.innerHTML = '<p class="text-sm text-slate-500 text-center py-6">No active or upcoming competitions.</p>';
            return;
          }
          var html = '<div class="space-y-3">';
          active.forEach(function (comp) {
            var status = getStatus(comp);
            var badgeClass = status === 'active'
              ? 'border-green-400/30 bg-green-400/10 text-green-400'
              : 'border-amber-400/30 bg-amber-400/10 text-amber-400';
            var badgeLabel = status.charAt(0).toUpperCase() + status.slice(1);
            html += '<a href="competition-detail.html?id=' + comp.id + '"'
              + ' class="flex items-center gap-4 rounded-xl border border-slate-700 bg-slate-800/50 px-5 py-4'
              + ' hover:border-slate-500 hover:bg-slate-800 transition-colors group">';
            html += '<img src="' + escHtml(getIcon(comp)) + '" alt="" class="w-9 h-9 object-contain shrink-0" width="36" height="36" />';
            html += '<div class="flex-1 min-w-0">';
            html += '<p class="font-semibold text-slate-100 group-hover:text-sky-300 transition-colors truncate">' + escHtml(comp.name) + '</p>';
            html += '<p class="text-xs text-slate-500 mt-0.5">' + escHtml(getSubtitle(comp, status)) + '</p>';
            html += '</div>';
            html += '<span class="text-xs px-2 py-0.5 rounded-full border shrink-0 ' + badgeClass + '">' + badgeLabel + '</span>';
            html += '</a>';
          });
          html += '</div>';
          el.innerHTML = html;
        }
        function applyPastFilter(ended, filter) {
          if (filter === '10') return ended.slice(0, 10);
          var cutoff;
          if (filter === '30d') cutoff = Date.now() - 30  * 86400000;
          if (filter === '1y')  cutoff = Date.now() - 365 * 86400000;
          if (cutoff) return ended.filter(function (c) { return new Date(c.endTime).getTime() >= cutoff; });
          return ended; // 'all'
        }
        function renderPastList(ended, filter) {
          var el = document.getElementById('past-comp-list');
          if (!el) return;
          var filtered = applyPastFilter(ended, filter);
          if (!filtered.length) {
            el.innerHTML = '<p class="text-sm text-slate-500 text-center py-6">No past competitions.</p>';
            return;
          }
          var html = '<div class="rounded-xl border border-slate-700 bg-slate-800/50 overflow-hidden">'
            + '<table class="w-full text-sm"><thead>'
            + '<tr class="border-b border-slate-700 bg-slate-800">'
            + '<th class="text-left px-4 py-2.5 text-xs font-medium text-slate-400">Competition</th>'
            + '<th class="text-left px-4 py-2.5 text-xs font-medium text-slate-400 hidden sm:table-cell">Type</th>'
            + '<th class="text-left px-4 py-2.5 text-xs font-medium text-slate-400 hidden sm:table-cell">Metric</th>'
            + '<th class="text-right px-4 py-2.5 text-xs font-medium text-slate-400">Ended</th>'
            + '</tr></thead><tbody>';
          filtered.forEach(function (comp) {
            html += '<tr class="border-b border-slate-700/50 last:border-0 hover:bg-slate-800/40 cursor-pointer"'
              + ' onclick="window.location.href=\'competition-detail.html?id=' + comp.id + '\'">';
            html += '<td class="px-4 py-3">'
              + '<div class="flex items-center gap-3">'
              + '<img src="' + escHtml(getIcon(comp)) + '" alt="" class="w-6 h-6 object-contain shrink-0" width="24" height="24" />'
              + '<span class="font-medium text-slate-100">' + escHtml(comp.name) + '</span>'
              + '</div></td>';
            html += '<td class="px-4 py-3 text-slate-400 hidden sm:table-cell">' + (comp.type === 'team' ? 'Team' : 'Solo') + '</td>';
            html += '<td class="px-4 py-3 text-slate-400 hidden sm:table-cell">' + escHtml(getScopeLabel(comp)) + '</td>';
            html += '<td class="px-4 py-3 text-slate-500 text-right text-xs">' + escHtml(formatDate(comp.endTime)) + '</td>';
            html += '</tr>';
          });
          html += '</tbody></table></div>';
          el.innerHTML = html;
        }
        fetch('/api/competitions/_')
          .then(function (r) { return r.json(); })
          .then(function (comps) {
            renderList(comps);
            var ended = comps.filter(function (c) { return getStatus(c) === 'ended'; });
            renderPastList(ended, '10');
            var filterEl = document.getElementById('past-filter');
            if (filterEl) {
              filterEl.addEventListener('change', function () {
                renderPastList(ended, filterEl.value);
              });
            }
          })
          .catch(function () {
            var el = document.getElementById('comp-list');
            if (el) el.innerHTML = '<p class="text-sm text-red-400 text-center py-6">Failed to load competitions.</p>';
            var pastEl = document.getElementById('past-comp-list');
            if (pastEl) pastEl.innerHTML = '<p class="text-sm text-red-400 text-center py-6">Failed to load competitions.</p>';
          });
      })();
    </script>

  </div>

  <!-- ── Password gate logic ──────────────────────────────────────────────── -->
  <script>
    (function () {
      var SESSION_KEY = 'spooptool_competitions_unlocked';
      var PASSWORD    = 'ivebeenspooped';

      var gate        = document.getElementById('competition-gate');
      var content     = document.getElementById('competitions-content');
      var input       = document.getElementById('gate-password');
      var unlockBtn   = document.getElementById('gate-unlock');
      var errorEl     = document.getElementById('gate-error');

      function unlock() {
        sessionStorage.setItem(SESSION_KEY, '1');
        gate.classList.add('hidden');
        content.classList.remove('hidden');
      }

      // Already unlocked this session — skip the gate immediately
      if (sessionStorage.getItem(SESSION_KEY) === '1') {
        unlock();
      } else {
        // Focus the input once the page is ready
        input.focus();
      }

      unlockBtn.addEventListener('click', function () {
        if (input.value === PASSWORD) {
          errorEl.classList.add('hidden');
          unlock();
        } else {
          errorEl.classList.remove('hidden');
          input.value = '';
          input.focus();
        }
      });

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') unlockBtn.click();
      });
    })();
  </script>

</body>
</html>
