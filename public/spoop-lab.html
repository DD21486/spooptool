<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spoop testing ground – SpoopTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="/css/runescape-fonts.css" />
  <link rel="stylesheet" href="/css/spoops.css" />
  <style>
    body { background-color: #090b10; }
    .lab-page { max-width: 1180px; margin: 0 auto; padding: 28px 22px 48px; }
    .lab-top {
      display: grid;
      grid-template-columns: 220px minmax(280px, 1fr) 220px;
      gap: 22px;
      align-items: start;
    }
    .lab-stage {
      width: 192px;
      height: 288px;
      position: relative;
      background: #1a140e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      overflow: hidden;
    }
    .lab-stage canvas {
      width: 192px;
      height: 288px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }
    .lab-stage.show-grid::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.16) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.16) 1px, transparent 1px);
      background-size: 12px 12px;
      pointer-events: none;
    }
    .lab-poses { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
    .lab-poses button,
    .lab-clear {
      border: 1px solid #3f2e1c;
      background: #1c140c;
      color: #e7d7b1;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
    }
    .lab-poses button.is-on { border-color: #f0d878; color: #fff6c8; }
    .spoop-slot {
      width: 52px;
      height: 52px;
      background: #1c140c;
      border: 2px solid #3f2e1c;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .spoop-slot.is-over { border-color: #f0d878; background: #2a2116; }
    .spoop-slot img { width: 36px; height: 36px; object-fit: contain; image-rendering: pixelated; pointer-events: none; }
    .spoop-grid { display: grid; grid-template-columns: repeat(3, 52px); gap: 4px; }
    .lab-filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 12px; }
    .lab-filters select,
    .lab-filters input,
    .lab-name {
      background: #121820;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 13px;
    }
    .lab-items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 6px;
    }
    .lab-item {
      background: #1c140c;
      border: 2px solid #3f2e1c;
      border-radius: 6px;
      padding: 6px 4px 5px;
      text-align: center;
      cursor: grab;
    }
    .lab-item:active { cursor: grabbing; }
    .lab-item img { width: 40px; height: 40px; margin: 0 auto 4px; object-fit: contain; image-rendering: pixelated; pointer-events: none; }
    .lab-item span { display: block; font-size: 10px; line-height: 1.25; color: #e7e1d4; }
    .lab-swatch {
      width: 40px;
      height: 40px;
      margin: 0 auto 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #1a140e;
      font-weight: 700;
      overflow: hidden;
    }
    .lab-swatch { position: relative; }
    .lab-swatch img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      margin: 0;
      background: #1c140c;
    }
    .lab-skill {
      display: grid;
      grid-template-columns: 16px 72px 52px;
      gap: 6px;
      align-items: center;
      margin-bottom: 4px;
    }
    .lab-skill input { width: 52px; }
    .lab-skill img { width: 16px; height: 16px; }
    @media (max-width: 860px) {
      .lab-top { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="spoop-shell min-h-screen antialiased">
  <div class="lab-page">
    <header class="spoop-top">
      <div>
        <a class="spoop-back" href="/spoops.html">Spoops</a>
        <h1>Testing ground</h1>
        <p class="spoop-lead">Drag gear onto the slots. The figure uses the same sprite as the arena.</p>
      </div>
    </header>
    <div class="lab-top">
      <section>
        <div id="lab-stage" class="lab-stage show-grid">
          <canvas id="lab-spoop" width="16" height="24"></canvas>
        </div>
        <div class="lab-poses" id="lab-poses"></div>
        <label class="mt-3 flex items-center gap-2 text-xs text-slate-400">
          <input id="lab-grid" type="checkbox" checked />
          Character squares
        </label>
        <label class="mt-2 block text-xs text-slate-400">
          Name
          <input id="lab-name" class="lab-name mt-1 block w-full" value="Tester" />
        </label>
      </section>
      <section id="lab-stats" class="rounded-xl border border-slate-700 bg-slate-800/60 p-4"></section>
      <section>
        <div class="flex items-baseline justify-between mb-2">
          <h2 class="text-sm text-slate-300">Wearing</h2>
          <button type="button" id="lab-clear" class="lab-clear">Clear</button>
        </div>
        <div class="spoop-grid" id="lab-slots"></div>
      </section>
    </div>
    <div class="lab-filters" id="lab-filters"></div>
    <div class="lab-items" id="lab-items"></div>
  </div>
  <script src="/js/spoop.js?v=bows"></script>
  <script src="/js/spoop-lab.js?v=bows"></script>
</body>
</html>
