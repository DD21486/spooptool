<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Test raid – SpoopTool</title>
  <link rel="stylesheet" href="/css/runescape-fonts.css" />
  <link rel="stylesheet" href="/css/arena.css" />
  <link rel="stylesheet" href="/css/raid3d.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="arena-page r3d-page is-test">
  <header class="arena-bar">
    <a href="/spoop.html" class="r3d-back r3d-home">&larr; Spoop</a>
    <a href="/raid.html" class="r3d-back">2D raid</a>
    <div id="pit-picks" class="pit-picks"></div>
    <div class="pit-controls">
      <label>Boss
        <select id="r3d-boss">
          <option value="raid" selected>Full raid</option>
          <option value="live">Live raid</option>
          <option value="elvarg">Elvarg</option>
          <option value="mole">Giant Mole</option>
          <option value="brutus">Brutus</option>
          <option value="scurrius">Scurrius</option>
          <option value="chaos">Chaos Elemental</option>
          <option value="leviathan">The Leviathan</option>
          <option value="obor">Obor</option>
          <option value="bryophyta">Bryophyta</option>
          <option value="kbd">King Black Dragon</option>
          <option value="vorkath">Vorkath</option>
          <option value="kq">Kalphite Queen</option>
          <option value="sarachnis">Sarachnis</option>
          <option value="grotesque">Grotesque Guardians</option>
          <option value="skotizo">Skotizo</option>
          <option value="crazy">Crazy archaeologist</option>
          <option value="zulrah">Zulrah</option>
        </select>
      </label>
      <label>Tier
        <select id="r3d-tier">
          <option value="trivial">Trivial</option>
          <option value="easy" selected>Easy</option>
          <option value="medium">Medium</option>
          <option value="tough">Tough</option>
          <option value="hard">Hard</option>
          <option value="elite">Elite</option>
          <option value="master">Master</option>
          <option value="god">God</option>
        </select>
      </label>
      <label>Seed <input id="r3d-seed" type="text" autocomplete="off" spellcheck="false" /></label>
      <label>Speed
        <select id="r3d-speed">
          <option value="0.25">Slow-mo</option>
          <option value="0.75">Slow</option>
          <option value="1.5" selected>Normal</option>
          <option value="3">Fast</option>
        </select>
      </label>
      <button type="button" id="r3d-fight">Fight</button>
      <button type="button" id="r3d-replay">Replay</button>
      <p id="r3d-status" class="r3d-status">Pick the party and send them in.</p>
    </div>
  </header>
  <main id="r3d-stage" class="r3d-stage" aria-label="3D raid">
    <canvas id="r3d-canvas" class="r3d-canvas"></canvas>
    <div id="r3d-overlay" class="r3d-overlay" aria-hidden="true"></div>
    <div id="r3d-party" class="r3d-party" aria-label="Party health"></div>
    <div id="r3d-bossbar" class="r3d-bossbar" hidden>
      <div class="r3d-bossbar-line"><strong></strong><span></span></div>
      <div class="r3d-bossbar-track"><i></i><b></b></div>
    </div>
    <div id="r3d-banner" class="r3d-banner" hidden></div>
    <div id="r3d-callout" class="r3d-callout" hidden></div>
    <div id="r3d-raid" class="raid-loot r3d-raid" hidden>
      <div class="raid-card" role="dialog" aria-label="Raid">
        <p class="raid-kicker"></p>
        <p class="raid-phase"></p>
        <div class="raid-stage"></div>
      </div>
    </div>
    <div id="r3d-card" class="r3d-card" hidden>
      <div class="r3d-card-copy">
        <p class="r3d-card-kicker"></p>
        <p class="r3d-card-title"></p>
        <div class="r3d-card-body"></div>
      </div>
      <aside id="r3d-odds" class="odds-card r3d-odds" hidden>
        <p class="wait-kicker">To win</p>
        <div class="odds-scroll">
          <table class="odds-table">
            <thead>
              <tr>
                <th>Spoop</th>
                <th>GS</th>
                <th>HP</th>
                <th>ATK</th>
                <th>STR</th>
                <th>DEF</th>
                <th>RNG</th>
                <th>MAG</th>
                <th>PRY</th>
                <th class="odds-price">Odds</th>
                <th class="odds-trend">1h</th>
              </tr>
            </thead>
            <tbody id="r3d-odds-list"></tbody>
          </table>
        </div>
        <div class="odds-chart-wrap">
          <p class="wait-kicker">Since 9am</p>
          <div id="r3d-odds-chart" class="odds-chart"></div>
        </div>
      </aside>
    </div>
    <ol id="r3d-log" class="r3d-log"></ol>
    <section id="r3d-meter" class="r3d-meter" aria-label="Damage meter" hidden>
      <header><span>Damage</span><span>Total (DPS)</span></header>
      <div class="r3d-meter-rows"></div>
    </section>
    <div class="r3d-view">
      <label><input type="checkbox" id="r3d-pixel" checked> Pixel</label>
      <label><input type="checkbox" id="r3d-ps1" checked> PS1</label>
      <label><input type="checkbox" id="r3d-names" checked> Names</label>
      <button type="button" id="r3d-sound" class="r3d-sound" aria-pressed="true" aria-label="Turn sound off" title="Sound on">
        <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.2h3.4L12 4.8v14.4l-4.6-4.4H4z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M15.2 9.1a3.6 3.6 0 0 1 0 5.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M17.5 6.8a6.6 6.6 0 0 1 0 10.4"/></svg>
        <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.2h3.4L12 4.8v14.4l-4.6-4.4H4z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M16 9.2l4.6 5.6M20.6 9.2 16 14.8"/></svg>
      </button>
      <div class="r3d-cams" role="group" aria-label="Camera">
        <button type="button" data-cam="cinematic" aria-pressed="true">Cinematic</button>
        <button type="button" data-cam="free" aria-pressed="false">Free cam</button>
      </div>
      <button type="button" id="r3d-cam" hidden>Reset</button>
    </div>
  </main>
  <footer class="r3d-transport">
    <button type="button" id="r3d-pause" aria-label="Pause">Pause</button>
    <input type="range" id="r3d-scrub" min="0" max="100" step="0.05" value="0" aria-label="Fight timeline" />
    <span id="r3d-clock" class="r3d-clock">0.0s</span>
  </footer>
  <script src="/js/spoop.js"></script>
  <script type="module" src="/js/raid3d/main.js"></script>
</body>
</html>
