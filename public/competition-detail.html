<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Competition – SpoopTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="css/runescape-fonts.css" />
  <style>
    body { background-color: #0f172a; }
  </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-200 antialiased">
  <div class="max-w-4xl mx-auto px-4 pt-14 sm:pt-6 pb-12 relative">

    <!-- Top-right hamburger menu -->
    <header class="absolute top-3 right-4 z-20 flex justify-end">
      <div class="relative" id="header-menu-wrap">
        <button type="button" id="header-menu-btn" class="p-2 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800 border border-slate-600/80" aria-label="Menu" aria-expanded="false" aria-haspopup="true">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div id="header-menu-dropdown" class="absolute right-0 top-full mt-1.5 w-48 rounded-lg border border-slate-600 bg-slate-800 shadow-xl py-1 hidden" role="menu">
          <a href="competitions.html" role="menuitem" class="flex items-center gap-2 px-3 py-2 text-sm text-sky-400 hover:bg-slate-700 rounded-lg">
            &larr; Competitions
          </a>
          <a href="index.html" role="menuitem" class="flex items-center gap-2 px-3 py-2 text-sm text-slate-400 hover:bg-slate-700 rounded-lg">
            &larr; SpoopTool
          </a>
        </div>
      </div>
    </header>

    <!-- Back breadcrumb -->
    <div class="pt-6 mb-6">
      <a href="competitions.html" class="text-sm text-sky-400 hover:text-sky-300 transition-colors">&larr; Back to Competitions</a>
    </div>

    <!-- Competition header: icon + name + status badges — filled by JS -->
    <div id="comp-header" class="flex items-center gap-5 mb-8"></div>

    <!-- Top info cards: Schedule | Leader | Top Contributor -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">

      <div class="rounded-xl border border-slate-700 bg-slate-800/50 p-5">
        <p class="text-xs font-medium text-slate-500 uppercase tracking-wide mb-3">Schedule</p>
        <div id="schedule-content"></div>
      </div>

      <div id="leader-card" class="rounded-xl border border-slate-700 bg-slate-800/50 p-5"></div>

      <div id="contributor-card" class="rounded-xl border border-slate-700 bg-slate-800/50 p-5"></div>

    </div>

    <!-- Leaderboard card -->
    <div class="rounded-xl border border-slate-700 bg-slate-800/50">
      <div class="px-4 py-3 border-b border-slate-700">
        <h2 class="text-base font-semibold text-slate-100">Leaderboard</h2>
      </div>
      <div class="overflow-x-clip">
        <table class="w-full text-sm">
          <thead id="lb-thead" class="sticky top-0 z-10"></thead>
          <tbody id="lb-tbody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="js/competition-detail.js"></script>
</body>
</html>
