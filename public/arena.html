<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena – SpoopTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="/css/runescape-fonts.css" />
  <link rel="stylesheet" href="/css/arena.css?v=weapon-speed" />
</head>
<body class="arena-page">
  <header class="arena-bar">
    <a href="/spoops.html" class="text-xs text-sky-400 hover:text-sky-300">Spoops</a>
    <p id="arena-countdown" class="countdown">Next Tournament</p>
    <p id="arena-status" class="text-xs text-slate-400">Loading the Spoopfight…</p>
  </header>

  <section id="arena-results" class="results" hidden></section>

  <ul id="arena-roster" class="roster"></ul>

  <div id="arena-pit" class="pit" aria-label="Arena">
    <div class="pit-post pit-post-nw"></div>
    <div class="pit-post pit-post-ne"></div>
    <div class="pit-post pit-post-sw"></div>
    <div class="pit-post pit-post-se"></div>
    <svg id="arena-lines" class="aim-lines" viewBox="0 0 100 72" preserveAspectRatio="none"></svg>
    <div id="arena-actors"></div>
    <div id="arena-fx"></div>
    <div id="arena-banner" class="arena-banner" hidden></div>
    <div id="arena-wait" class="wait-card" hidden>
      <p id="arena-wait-kicker" class="wait-kicker">Next Tournament</p>
      <p id="arena-wait-clock" class="wait-time">--:--:--</p>
      <p id="arena-wait-when" class="wait-when"></p>
      <button id="arena-replay" class="replay-btn" type="button" hidden>Watch replay</button>
    </div>
    <div id="arena-recap" class="recap" hidden></div>
  </div>

  <script src="/js/spoop.js"></script>
  <script src="/js/arena.js?v=weapon-speed"></script>
</body>
</html>
