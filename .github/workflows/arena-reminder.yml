# Every 5 minutes. GitHub drops a every-minute schedule, and this run also
# advances the world so hourly spoop posts are not left until the long snapshot.
name: Arena reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send due Spoopfight reminders
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://spooptool.vercel.app/api/cron/snapshot?arena_reminder=1"
