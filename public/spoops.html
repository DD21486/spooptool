<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spoops – SpoopTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="/css/runescape-fonts.css" />
  <style>
    body { background-color: #0f172a; }
    .spoop-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    @media (min-width: 768px) {
      .spoop-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .spoop-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-width: 0;
      padding: 12px 8px 10px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.72);
      text-decoration: none;
    }
    .spoop-card:hover { background: rgba(51, 65, 85, 0.85); border-color: #475569; }
    .spoop-card .spoop-sprite {
      width: 52px;
      height: 78px;
      border-width: 3px;
    }
    .spoop-card h2 {
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.2;
      color: #f8fafc;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .spoop-owner {
      margin-top: 2px;
      font-size: 11px;
      line-height: 1.2;
      color: #64748b;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .spoop-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      width: 100%;
      margin-top: 8px;
    }
    .spoop-stats div {
      min-width: 0;
      padding: 4px 2px 3px;
      border-radius: 6px;
      background: #0f172a;
    }
    .spoop-stats dt {
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .spoop-stats dd {
      font-size: 13px;
      line-height: 1.2;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
    }
    .spoop-act {
      margin-top: 8px;
      font-size: 11px;
      line-height: 1.3;
      color: #fde68a;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .spoop-sprite {
      width: 80px;
      height: 120px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #c4a574;
      border: 4px solid #1e293b;
      border-radius: 8px;
    }
    .gielinor-wrap { margin-bottom: 0.25rem; }
    .gielinor {
      position: relative;
      overflow: hidden;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #576c9d;
      touch-action: none;
      cursor: grab;
      user-select: none;
    }
    .gielinor.is-drag { cursor: grabbing; }
    .gielinor-stage {
      position: relative;
      width: 100%;
      transform-origin: 0 0;
    }
    .gielinor-map {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      pointer-events: none;
    }
    .gielinor-zoom {
      position: absolute;
      z-index: 7;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
    }
    .gielinor-zoom button {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(240, 216, 120, 0.55);
      background: rgba(15, 23, 42, 0.9);
      color: #fde68a;
      font-size: 16px;
      line-height: 1;
    }
    .gielinor-zoom button:hover { background: rgba(30, 41, 59, 0.95); }
    .spoop-pin {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -100%);
      text-decoration: none;
      max-width: 42%;
    }
    .spoop-pin.is-low {
      transform: translate(-50%, 0);
      flex-direction: column-reverse;
    }
    .spoop-pin:hover { z-index: 6; }
    .spoop-pin-name {
      font-size: 10px;
      line-height: 1.25;
      color: #f8fafc;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(240, 216, 120, 0.75);
      border-radius: 999px;
      padding: 1px 6px;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spoop-pin-act {
      display: none;
      margin-top: 2px;
      font-size: 9px;
      line-height: 1.2;
      color: #fde68a;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 6px;
      padding: 1px 5px;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spoop-pin.is-low .spoop-pin-act { margin-top: 0; margin-bottom: 2px; }
    .spoop-pin:hover .spoop-pin-act,
    .spoop-pin:focus-visible .spoop-pin-act { display: block; }
    .spoop-pin-orb {
      width: 11px;
      height: 11px;
      margin-top: 2px;
      border-radius: 50%;
      border: 2px solid #f8fafc;
      box-shadow: 0 0 0 1px #0f172a, 0 1px 4px rgba(0, 0, 0, 0.55);
      flex: 0 0 auto;
    }
    .spoop-pin.is-low .spoop-pin-orb { margin-top: 0; margin-bottom: 2px; }
    .spoop-pin-melee { background: #ef4444; }
    .spoop-pin-ranged { background: #4ade80; }
    .spoop-pin-magic { background: #60a5fa; }
    .spoop-pin-skilling { background: #fbbf24; }
    .gielinor-credit {
      margin-top: 0.35rem;
      font-size: 10px;
      color: #64748b;
    }
    .gielinor-credit a { color: #7dd3fc; }
  </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-200 antialiased" data-page="list">
  <div class="max-w-5xl mx-auto px-4 py-8">
    <header class="flex items-end justify-between gap-3 mb-6">
      <div>
        <a href="/" class="text-xs text-sky-400 hover:text-sky-300">SpoopTool</a>
        <h1 class="text-3xl text-slate-100 mt-1">Spoops</h1>
        <p class="text-sm text-slate-400 mt-1">They train, loot, and fight on their own. <span id="spoop-clock" class="text-slate-500"></span></p>
      </div>
      <a href="/arena.html" class="text-sm text-amber-300 hover:text-amber-200 shrink-0">Arena</a>
    </header>
    <div id="spoop-root" class="space-y-3"></div>
  </div>
  <script src="/js/spoop.js"></script>
</body>
</html>
