<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandbox – SpoopTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="stylesheet" href="/css/runescape-fonts.css" />
  <style>
    body { background-color: #0f172a; }
    #ascii-title {
      font-family: ui-monospace, monospace;
      font-size: clamp(0.35rem, 1.5vw, 0.6rem);
      line-height: 1.2;
      white-space: pre;
      overflow-x: auto;
      text-align: center;
    }
    #ascii-title .ascii-gradient-inner {
      background: linear-gradient(90deg, #3b82f6, #06b6d4, #14b8a6, #10b981, #8b5cf6, #a855f7, #3b82f6);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: ascii-gradient 6s ease-in-out infinite;
    }
    #ascii-title.ascii-chrome .ascii-gradient-inner {
      background: none;
      background-image: none;
      -webkit-text-fill-color: #38bdf8;
      color: #38bdf8;
      animation: none;
    }
    @keyframes ascii-gradient {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    #ascii-title .ascii-char {
      opacity: 0;
      animation: ascii-fade-in 0.08s ease-out forwards;
      color: inherit;
      -webkit-text-fill-color: inherit;
    }
    @keyframes ascii-fade-in {
      to { opacity: 1; }
    }
    #ascii-title .ascii-char.ascii-shimmer {
      animation: ascii-shimmer 2s ease-in-out;
    }
    @keyframes ascii-shimmer {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    #ascii-title .ascii-char.ascii-flash {
      animation: ascii-flash 0.8s ease-in-out;
    }
    @keyframes ascii-flash {
      0%, 100% { color: #94a3b8; }
      50% { color: var(--flash-color, #fff); }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-200 antialiased">

    <header class="absolute top-3 right-4 z-20 flex justify-end">

    <script>
      (function () {
        var btn = document.getElementById('header-menu-btn');
        var dropdown = document.getElementById('header-menu-dropdown');
        if (!btn || !dropdown) return;
        function open() { dropdown.classList.remove('hidden'); btn.setAttribute('aria-expanded', 'true'); }
        function close() { dropdown.classList.add('hidden'); btn.setAttribute('aria-expanded', 'false'); }
        function toggle() { if (dropdown.classList.contains('hidden')) open(); else close(); }
        btn.addEventListener('click', function (e) { e.stopPropagation(); toggle(); });
        document.addEventListener('click', function () { close(); });
        dropdown.addEventListener('click', function (e) { e.stopPropagation(); });
      })();
    </script>

    <div class="flex flex-col items-center mb-8">
      <pre id="ascii-title" class="m-0" aria-hidden="true"><!-- filled by script --></pre>
    </div>
    <script>
      (function () {
        var lines = [
          '  /$$$$$$   /$$$$$$  /$$   /$$  /$$$$$$$  /$$$$$$$   /$$$$$$  /$$   /$$',
          ' /$$__  $$ /$$__  $$| $$$ | $$ | $$__  $$| $$__  $$ /$$__  $$|  $$/ $$/',
          '| $$  \\__/| $$  \\ $$| $$$$| $$ | $$  | $$| $$  \\ $$| $$  \\ $$ \\  $$$$/ ',
          '|  $$$$$$ | $$$$$$$$| $$ $$ $$ | $$  | $$| $$$$$$$/| $$  | $$  >$$  $$<',
          ' \\____  $$| $$__  $$| $$  $$$$ | $$  | $$| $$__  $$| $$  | $$ /$$/\\  $$',
          ' /$$  \\ $$| $$  \\ $$| $$\\  $$$ | $$  | $$| $$  \\ $$| $$  | $$| $$  \\ $$',
          '|  $$$$$$/| $$  | $$| $$ \\  $$ | $$$$$$$/ | $$$$$$$/|  $$$$$$/| $$  | $$',
          ' \\______/ |__/  |__/|__/  \\__/ |_______/  |_______/  \\______/ |__/  \\__/'
        ];
        var el = document.getElementById('ascii-title');
        if (!el) return;
        if (/Chrome/.test(navigator.userAgent)) el.classList.add('ascii-chrome');
        var durationMs = 3000;
        var html = '';
        function esc(c) { return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c; }
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          var delay = (i / lines.length) * durationMs;
          for (var j = 0; j < line.length; j++) {
            html += '<span class="ascii-char" style="animation-delay:' + delay + 'ms">' + esc(line[j]) + '</span>';
          }
          if (i < lines.length - 1) html += '\n';
        }
        el.innerHTML = '<span class="ascii-gradient-inner">' + html + '</span>';

        var allChars = el.querySelectorAll('.ascii-char');
        var visibleChars = [];
        for (var i = 0; i < allChars.length; i++) {
          var text = (allChars[i].textContent || '').trim();
          if (text.length > 0) visibleChars.push(allChars[i]);
        }

        var flashColors = ['#ffffff', '#38bdf8', '#fbbf24', '#a3e635', '#f472b6', '#c084fc', '#2dd4bf'];

        function triggerShimmer() {
          if (visibleChars.length === 0) return;
          var span = visibleChars[Math.floor(Math.random() * visibleChars.length)];
          span.classList.remove('ascii-shimmer');
          span.offsetHeight;
          span.classList.add('ascii-shimmer');
          setTimeout(function () { span.classList.remove('ascii-shimmer'); }, 2000);
        }

        function triggerFlash() {
          if (visibleChars.length === 0) return;
          var span = visibleChars[Math.floor(Math.random() * visibleChars.length)];
          span.style.setProperty('--flash-color', flashColors[Math.floor(Math.random() * flashColors.length)]);
          span.classList.remove('ascii-flash');
          span.offsetHeight;
          span.classList.add('ascii-flash');
          setTimeout(function () { span.classList.remove('ascii-flash'); }, 800);
        }

        function startShimmer() {
          triggerShimmer();
          setInterval(triggerShimmer, 500);
          triggerFlash();
          setInterval(triggerFlash, 600);
        }
        setTimeout(startShimmer, durationMs + 400);
      })();
    </script>

    <section class="mt-6 rounded-xl border border-slate-700 bg-slate-800/50">
      <div id="ehb-section-header" class="px-4 py-3 border-b border-slate-700 flex flex-wrap items-center justify-between gap-3 cursor-pointer select-none hover:bg-slate-800/40">
        <h2 class="text-lg font-semibold text-slate-100 flex items-center gap-2">
          <span id="ehb-section-arrow" class="text-slate-500 text-xs">▼</span>
          EHB Boss Rates
        </h2>
        <div class="flex items-center gap-2" id="ehb-section-controls">
          <button id="ehb-save-btn" type="button" class="px-3 py-1 rounded bg-sky-700 hover:bg-sky-600 border border-sky-500 text-sm text-white transition-colors disabled:opacity-50">Save to DB</button>

      <div id="ehb-section-body">

            <thead class="sticky top-0 z-10">
              <tr class="border-b border-slate-700 bg-slate-800">

                <th class="text-left px-4 py-2 text-slate-400 font-medium">Method</th>

                <th class="text-right px-4 py-2 text-slate-400 font-medium">Rate (KC/hr)</th>
              </tr>
            </thead>
            <tbody id="ehb-tbody"></tbody>
          </table>
        </div>
        <p id="ehb-loading" class="px-4 py-6 text-slate-500 text-center">Loading…</p>
        <p id="ehb-error" class="px-4 py-6 text-red-400 text-center hidden"></p>
      </div>
    </section>
    <script>
      (function () {
        var ehbHeader   = document.getElementById('ehb-section-header');
        var ehbBody     = document.getElementById('ehb-section-body');
        var ehbArrow    = document.getElementById('ehb-section-arrow');
        var ehbControls = document.getElementById('ehb-section-controls');
        var ehbTbody    = document.getElementById('ehb-tbody');
        var ehbLoading  = document.getElementById('ehb-loading');
        var ehbError    = document.getElementById('ehb-error');
        var ehbSaveBtn  = document.getElementById('ehb-save-btn');
        var currentEhbRates = null;
        var ehbOpen = true;

        ehbHeader.addEventListener('click', function (e) {
          if (ehbControls.contains(e.target)) return;
          ehbOpen = !ehbOpen;
          ehbBody.classList.toggle('hidden', !ehbOpen);
          ehbArrow.textContent = ehbOpen ? '▼' : '▶';
        });

        function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }
        function fmt(n) { return Number(n).toLocaleString(); }

        function renderEhbRates(data) {
          ehbTbody.innerHTML = '';
          if (!Array.isArray(data) || !data.length) {
            ehbLoading.textContent = 'No data returned.';
            return;
          }
          ehbLoading.classList.add('hidden');

          data.forEach(function (entry, idx) {
            var bossName = capitalize((entry.boss || 'Unknown').replace(/_/g, ' '));
            var methods = Array.isArray(entry.methods) ? entry.methods : [];

            methods.forEach(function (method, mi) {
              var tr = document.createElement('tr');
              tr.className = 'border-b border-slate-700/50 hover:bg-slate-800/40';

              var bossCell = '';
              if (mi === 0) {
                bossCell = '<td class="px-4 py-2 font-medium text-slate-200 align-top" rowspan="' + methods.length + '">' + bossName + '</td>';
              }

              var startKc = method.startKc != null ? method.startKc : (method.startExp != null ? method.startExp : 0);
              tr.innerHTML = bossCell
                + '<td class="px-4 py-2 text-slate-300">' + (method.description || '—') + '</td>'
                + '<td class="px-4 py-2 text-right font-mono text-slate-400">' + fmt(startKc) + '</td>'
                + '<td class="px-4 py-2 text-right font-mono text-sky-300">' + (method.rate != null ? method.rate.toFixed(2) : '—') + '</td>';

              ehbTbody.appendChild(tr);
            });

            if (idx < data.length - 1 && methods.length > 0) {
              var sep = document.createElement('tr');
              sep.innerHTML = '<td colspan="4" class="p-0"><div class="border-b border-slate-600/60"></div></td>';
              ehbTbody.appendChild(sep);
            }
          });
        }

        function loadEhbRates() {
          ehbLoading.classList.remove('hidden');
          ehbError.classList.add('hidden');
          ehbTbody.innerHTML = '';
          ehbLoading.textContent = 'Loading\u2026';

          fetch('https://api.wiseoldman.net/v2/efficiency/rates?metric=ehb&type=main')
            .then(function (res) {
              if (!res.ok) throw new Error('HTTP ' + res.status);
              return res.json();
            })
            .then(function (data) { currentEhbRates = data; renderEhbRates(data); })
            .catch(function (err) {
              ehbLoading.classList.add('hidden');
              ehbError.classList.remove('hidden');
              ehbError.textContent = 'Failed to load rates: ' + err.message;
            });
        }

        ehbSaveBtn.addEventListener('click', function () {
          if (!currentEhbRates) return;
          ehbSaveBtn.disabled = true;
          ehbSaveBtn.textContent = 'Saving\u2026';
          fetch('/api/competitions/_?action=save-rates', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ metric: 'ehb', rates: currentEhbRates })
          })
            .then(function (r) { return r.json(); })
            .then(function (result) {
              ehbSaveBtn.textContent = result.ok ? 'Saved!' : 'Error saving';
              setTimeout(function () { ehbSaveBtn.disabled = false; ehbSaveBtn.textContent = 'Save to DB'; }, 2000);
            })
            .catch(function () {
              ehbSaveBtn.textContent = 'Error';
              setTimeout(function () { ehbSaveBtn.disabled = false; ehbSaveBtn.textContent = 'Save to DB'; }, 2000);
            });
        });

        loadEhbRates();
      })();
    </script>

    <section class="mt-6 rounded-xl border border-slate-700 bg-slate-800/50">
      <div id="xp-section-header" class="px-4 py-3 border-b border-slate-700 flex items-center gap-2 cursor-pointer select-none hover:bg-slate-800/40">

    <script>
      (function () {
        // Same formula as lib/xpTable.js
        var xpTable = [0, 0];
        var total = 0;
        for (var i = 1; i <= 98; i++) {
          total = Math.floor(total + i + 300 * Math.pow(2, i / 7));
          xpTable[i + 1] = Math.floor(total / 4);
        }

        function fmt(n) { return Number(n).toLocaleString(); }

        var tbody = document.getElementById('xp-tbody');
        for (var lvl = 1; lvl <= 99; lvl++) {
          var startXp = xpTable[lvl];
          var endXp = lvl < 99 ? xpTable[lvl + 1] : 200000000;
          var diff = endXp - startXp;
          var tr = document.createElement('tr');
          tr.className = 'border-b border-slate-700/50 hover:bg-slate-800/40';
          tr.innerHTML =
            '<td class="px-4 py-1.5 text-right font-mono text-slate-200">' + lvl + '</td>' +
            '<td class="px-4 py-1.5 text-right font-mono text-slate-400">' + fmt(startXp) + '</td>' +
            '<td class="px-4 py-1.5 text-right font-mono text-slate-400">' + fmt(endXp) + '</td>' +
            '<td class="px-4 py-1.5 text-right font-mono text-sky-300">' + fmt(diff) + '</td>';
          tbody.appendChild(tr);
        }

        // Collapse toggle
        var header = document.getElementById('xp-section-header');
        var body = document.getElementById('xp-section-body');
        var arrow = document.getElementById('xp-section-arrow');
        var open = true;
        header.addEventListener('click', function () {
          open = !open;
          body.classList.toggle('hidden', !open);
          arrow.textContent = open ? '▼' : '▶';
        });
      })();
    </script>

    <p class="mt-8 text-center text-xs text-slate-500">Sandbox — not linked from main nav</p>

    <script>
      (function () {
        var tbody = document.getElementById('rates-tbody');
        var loading = document.getElementById('rates-loading');
        var errorEl = document.getElementById('rates-error');
        var typeSelect = document.getElementById('type-select');
        var ehpSaveBtn = document.getElementById('ehp-save-btn');
        var currentEhpRates = null;

        // Build XP table (same formula as lib/xpTable.js)
        var xpTable = [0, 0];
        var _t = 0;
        for (var _i = 1; _i <= 98; _i++) {
          _t = Math.floor(_t + _i + 300 * Math.pow(2, _i / 7));
          xpTable[_i + 1] = Math.floor(_t / 4);
        }
        function xpToLevel(xp) {
          for (var l = 98; l >= 1; l--) {
            if (xp >= xpTable[l + 1]) return l + 1;
          }
          return 1;
        }

        function fmt(n) { return Number(n).toLocaleString(); }

        function capitalize(str) {
          return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function renderRates(data) {
          tbody.innerHTML = '';
          if (!Array.isArray(data) || data.length === 0) {
            loading.textContent = 'No data returned.';
            return;
          }
          loading.classList.add('hidden');

          data.forEach(function (entry, idx) {
            var skillName = capitalize(entry.skill || entry.boss || 'Unknown');
            var methods = Array.isArray(entry.methods) ? entry.methods : [];

            methods.forEach(function (method, mi) {
              var tr = document.createElement('tr');
              tr.className = 'border-b border-slate-700/50 hover:bg-slate-800/40';

              var skillCell = '';
              if (mi === 0) {
                skillCell = '<td class="px-4 py-2 font-medium text-slate-200 align-top" rowspan="' + methods.length + '">' + skillName + '</td>';
              }

              var nextMethod = methods[mi + 1];
              var rawEndXp = nextMethod ? nextMethod.startExp : 200000000;
              var startLvl = xpToLevel(method.startExp || 0);
              var endLvl = xpToLevel(rawEndXp);

              tr.innerHTML = skillCell +
                '<td class="px-4 py-2 text-slate-300">' + (method.description || '—') + '</td>' +
                '<td class="px-4 py-2 text-right font-mono text-slate-400">' + fmt(method.startExp || 0) + '</td>' +
                '<td class="px-4 py-2 text-right font-mono text-amber-400">' + startLvl + '</td>' +
                '<td class="px-4 py-2 text-right font-mono text-slate-400">' + fmt(rawEndXp) + '</td>' +
                '<td class="px-4 py-2 text-right font-mono text-amber-400">' + endLvl + '</td>' +
                '<td class="px-4 py-2 text-right font-mono text-sky-300">' + fmt(method.rate || 0) + '</td>';

              tbody.appendChild(tr);
            });

            // Separator row between skills
            if (idx < data.length - 1 && methods.length > 0) {
              var sep = document.createElement('tr');
              sep.innerHTML = '<td colspan="7" class="p-0"><div class="border-b border-slate-600/60"></div></td>';
              tbody.appendChild(sep);
            }
          });
        }

        function loadRates() {
          loading.classList.remove('hidden');
          errorEl.classList.add('hidden');
          tbody.innerHTML = '';
          loading.textContent = 'Loading…';

          fetch('https://api.wiseoldman.net/v2/efficiency/rates?type=' + typeSelect.value + '&metric=ehp')
            .then(function (res) {
              if (!res.ok) throw new Error('HTTP ' + res.status);
              return res.json();
            })
            .then(function (data) { currentEhpRates = data; renderRates(data); })
            .catch(function (err) {
              loading.classList.add('hidden');
              errorEl.classList.remove('hidden');
              errorEl.textContent = 'Failed to load rates: ' + err.message;
            });
        }

        typeSelect.addEventListener('change', function () {
          currentEhpRates = null;
          loadRates();
        });

        ehpSaveBtn.addEventListener('click', function () {
          if (!currentEhpRates) return;
          var gm = typeSelect.value;
          ehpSaveBtn.disabled = true;
          ehpSaveBtn.textContent = 'Saving\u2026';
          fetch('/api/competitions/_?action=save-rates', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ metric: 'ehp', gameMode: gm, rates: currentEhpRates })
          })
            .then(function (r) { return r.json(); })
            .then(function (result) {
              ehpSaveBtn.textContent = result.ok ? 'Saved!' : 'Error saving';
              setTimeout(function () { ehpSaveBtn.disabled = false; ehpSaveBtn.textContent = 'Save to DB'; }, 2000);
            })
            .catch(function () {
              ehpSaveBtn.textContent = 'Error';
              setTimeout(function () { ehpSaveBtn.disabled = false; ehpSaveBtn.textContent = 'Save to DB'; }, 2000);
            });
        });

        loadRates();
      })();
    </script>
