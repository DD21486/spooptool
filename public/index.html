<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpoopTool – OSRS Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <style>
    body { background-color: #0f172a; }
    #ascii-title {
      font-family: ui-monospace, monospace;
      font-size: clamp(0.35rem, 1.5vw, 0.6rem);
      line-height: 1.2;
      color: #94a3b8;
      white-space: pre;
      overflow-x: auto;
      text-align: center;
    }
    #ascii-title .ascii-char {
      opacity: 0;
      animation: ascii-fade-in 0.08s ease-out forwards;
    }
    @keyframes ascii-fade-in {
      to { opacity: 1; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-200 antialiased">
  <div class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex justify-center mb-6">
      <pre id="ascii-title" class="m-0" aria-hidden="true"><!-- filled by script --></pre>
    </div>
    <script>
      (function () {
        var art = [
          '  /$$$$$$  /$$$$$$$   /$$$$$$   /$$$$$$  /$$$$$$$  /$$$$$$$$ /$$$$$$   /$$$$$$  /$$            ',
          ' /$$__  $$| $$__  $$ /$$__  $$ /$$__  $$| $$__  $$|__  $$__//$$__  $$ /$$__  $$| $$            ',
          '| $$  \\__/| $$  \\ $$| $$  \\ $$| $$  \\ $$| $$  \\ $$   | $$  | $$  \\ $$| $$  \\ $$| $$            ',
          '|  $$$$$$ | $$$$$$$/| $$  | $$| $$  | $$| $$$$$$$/   | $$  | $$  | $$| $$  | $$| $$            ',
          ' \\____  $$| $$____/ | $$  | $$| $$  | $$| $$____/    | $$  | $$  | $$| $$  | $$| $$            ',
          ' /$$  \\ $$| $$      | $$  | $$| $$  | $$| $$         | $$  | $$  | $$| $$  | $$| $$            ',
          '|  $$$$$$/| $$      |  $$$$$$/|  $$$$$$/| $$         | $$  |  $$$$$$/|  $$$$$$/| $$$$$$$$      ',
          ' \\______/ |__/       \\______/  \\______/ |__/         |__/   \\______/  \\______/ |________/      '
        ].join('\n');
        var el = document.getElementById('ascii-title');
        var total = art.length;
        var durationMs = 3000;
        var html = '';
        for (var i = 0; i < total; i++) {
          var ch = art[i];
          var delay = (i / total) * durationMs;
          var escaped = ch === '&' ? '&amp;' : ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch;
          html += '<span class="ascii-char" style="animation-delay:' + delay + 'ms">' + escaped + '</span>';
        }
        el.innerHTML = html;
      })();
    </script>
    <header class="flex flex-wrap items-center justify-between gap-4 mb-6">
      <div class="flex items-center gap-3">
        <button type="button" id="btn-refresh" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-sm font-medium">
          Update all
        </button>
        <button type="button" id="btn-add" class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-sm font-medium">
          Add character
        </button>
      </div>
    </header>

    <!-- Two side-by-side tables -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <section class="rounded-xl border border-slate-700 bg-slate-800/50 overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-700 flex flex-wrap items-center justify-between gap-2">
          <h2 id="left-title" class="text-lg font-semibold text-slate-100">Total XP</h2>
          <div class="flex items-center gap-2 flex-shrink-0">
            <select id="filter-type" class="px-2 py-1 rounded bg-slate-700 border border-slate-600 text-sm focus:ring-1 focus:ring-sky-500">
              <option value="overall">Overall</option>
              <option value="skill">Skill</option>
            </select>
            <select id="filter-skill" class="px-2 py-1 rounded bg-slate-700 border border-slate-600 text-sm hidden">
              <option value="overall">Overall</option>
            </select>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-700 bg-slate-800/80">
                <th class="text-left px-4 py-2 text-slate-400 font-medium">#</th>
                <th class="text-left px-4 py-2 text-slate-400 font-medium">Character</th>
                <th class="text-right px-4 py-2 text-slate-400 font-medium">Total XP</th>
              </tr>
            </thead>
            <tbody id="left-tbody"></tbody>
          </table>
        </div>
        <p id="left-loading" class="px-4 py-6 text-slate-500 text-center">Loading…</p>
      </section>
      <section class="rounded-xl border border-slate-700 bg-slate-800/50 overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-700 flex flex-wrap items-center justify-between gap-2">
          <h2 id="right-title" class="text-lg font-semibold text-slate-100">Total boss kills</h2>
          <select id="filter-right-boss" class="px-2 py-1 rounded bg-slate-700 border border-slate-600 text-sm focus:ring-1 focus:ring-sky-500 flex-shrink-0">
            <option value="">Total</option>
          </select>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-700 bg-slate-800/80">
                <th class="text-left px-4 py-2 text-slate-400 font-medium">#</th>
                <th class="text-left px-4 py-2 text-slate-400 font-medium">Character</th>
                <th class="text-right px-4 py-2 text-slate-400 font-medium">Total KC</th>
              </tr>
            </thead>
            <tbody id="right-tbody"></tbody>
          </table>
        </div>
        <p id="right-loading" class="px-4 py-6 text-slate-500 text-center">Loading…</p>
      </section>
    </div>

    <p id="error-message" class="mt-4 text-red-400 text-sm hidden"></p>
  </div>

  <!-- Add character modal -->
  <div id="add-character-modal" class="fixed inset-0 z-50 flex hidden items-center justify-center bg-black/60 p-4" aria-hidden="true">
    <div class="w-full max-w-sm rounded-xl border border-slate-600 bg-slate-800 p-5 shadow-xl" role="dialog" aria-labelledby="modal-title" aria-modal="true">
      <h3 id="modal-title" class="text-lg font-semibold text-slate-100 mb-2">Add character</h3>
      <p class="text-slate-400 text-sm mb-4">Enter a character to be added to the list of characters.</p>
      <input type="text" id="modal-username" placeholder="Character name" maxlength="12" autocomplete="off"
        class="w-full px-3 py-2 rounded-lg bg-slate-700 border border-slate-600 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-sky-500 mb-3" />
      <p id="modal-error" class="text-red-400 text-sm mb-3 hidden"></p>
      <div class="flex justify-end gap-2">
        <button type="button" id="modal-cancel" class="px-3 py-1.5 rounded-lg bg-slate-600 hover:bg-slate-500 text-sm font-medium">Cancel</button>
        <button type="button" id="modal-submit" disabled class="px-3 py-1.5 rounded-lg bg-slate-600 text-slate-400 cursor-not-allowed text-sm font-medium">Add</button>
      </div>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
