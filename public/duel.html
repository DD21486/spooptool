<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Duel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="/css/runescape-fonts.css" />
  <link rel="stylesheet" href="/css/arena.css?v=duel-stage" />
</head>
<body class="arena-page" data-page="duel">
  <header class="arena-bar">
    <p id="arena-countdown" class="countdown">Duel</p>
    <p id="arena-status" class="text-xs text-slate-400">Loading the duel…</p>
  </header>
  <ul id="arena-roster" class="roster"></ul>
  <div id="arena-pit" class="pit" aria-label="Duel">
    <div class="pit-post pit-post-nw"></div>
    <div class="pit-post pit-post-ne"></div>
    <div class="pit-post pit-post-sw"></div>
    <div class="pit-post pit-post-se"></div>
    <svg id="arena-lines" class="aim-lines" viewBox="0 0 100 72" preserveAspectRatio="none"></svg>
    <div id="arena-actors"></div>
    <div id="arena-fx"></div>
    <div id="arena-banner" class="arena-banner" hidden></div>
    <div id="arena-wait" class="wait-row duel-stage" hidden>
      <div class="duel-side duel-side-a" data-side="0">
        <div class="duel-art-wrap"><canvas class="duel-art"></canvas></div>
        <strong class="duel-name"></strong>
        <p class="duel-meta"></p>
        <p class="duel-pct"></p>
        <p class="duel-line"></p>
        <span class="duel-badge" hidden>Winner</span>
      </div>
      <div class="duel-center">
        <p id="arena-wait-kicker" class="duel-kicker">Duel</p>
        <p class="duel-pot-label">Pot</p>
        <p class="duel-pot"><span id="duel-pot">0</span><small>gold</small></p>
        <p class="duel-stake" id="duel-stake"></p>
        <p id="arena-wait-clock" class="duel-clock">--:--</p>
        <p id="arena-wait-when" class="duel-when"></p>
      </div>
      <div class="duel-side duel-side-b" data-side="1">
        <div class="duel-art-wrap"><canvas class="duel-art"></canvas></div>
        <strong class="duel-name"></strong>
        <p class="duel-meta"></p>
        <p class="duel-pct"></p>
        <p class="duel-line"></p>
        <span class="duel-badge" hidden>Winner</span>
      </div>
    </div>
  </div>
  <script src="/js/spoop.js?v=duel"></script>
  <script src="/js/arena.js?v=watch"></script>
  <script src="/js/duel.js?v=stage"></script>
</body>
</html>
